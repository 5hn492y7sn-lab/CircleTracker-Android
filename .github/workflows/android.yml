
name: CircleTracker Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        run: |
          unzip -q CircleTracker_project.zip -d project
          test -f project/CircleTracker/app/build.gradle.kts

      - name: Build APK
        working-directory: project/CircleTracker
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CircleTracker-APK
          path: project/CircleTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
